project_id = "roxx-bce-technoriti"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/",
  "https://localhost:3000/"
]
jwt_expiry = 1800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[functions.create-registration]
verify_jwt = false

[functions.submit-utr]
verify_jwt = false

[functions.get-my-registrations]
verify_jwt = false

[functions.get-admin-registrations]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.manage-admins]
verify_jwt = false

[functions.manage-competitions]
verify_jwt = false

[functions.get-coordinator-registrations]
verify_jwt = false
